services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sstb
      POSTGRES_PASSWORD: sstb
      POSTGRES_DB: sstb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sstb -d sstb"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://sstb:sstb@db:5432/sstb
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
